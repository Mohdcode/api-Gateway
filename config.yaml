port: ":8080"

# Required for HS256 verification and keyed client identity hashes.
# Set JWT_SECRET to a fresh random value before starting the gateway.
jwt_secret: ""
jwt_issuer: ""
jwt_audience: ""

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

middleware_config:
  auth_apikey:
    valid_keys: []

services:
  - name: users
    route_pattern: "/users"
    urls:
      - "http://localhost:8081"
      - "http://localhost:8083"
    # Order matters: the first entry is the outermost wrapper.
    # metrics first means rejected requests (401/429/503) are counted too.
    middleware:
      - "metrics"
      - "auth_apikey"
      - "rate_limit"
      - "circuit_breaker"
    rate_limit_rps: 200
    rate_limit_burst: 400
    cb_failure_threshold: 6
    cb_reset_timeout_seconds: 15
