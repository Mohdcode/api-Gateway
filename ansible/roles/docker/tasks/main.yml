---
- name: Install Docker on Debian family
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install Docker on RedHat family
  ansible.builtin.dnf:
    name: docker
    state: present
  when: ansible_os_family == "RedHat"

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Verify the Docker daemon is reachable
  ansible.builtin.command: docker info
  changed_when: false
  retries: 5
  delay: 3
  register: docker_info
  until: docker_info.rc == 0
