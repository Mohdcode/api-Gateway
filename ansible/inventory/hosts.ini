# Local Docker Desktop / Linux host deployment (default).
# The playbook installs Docker, kind, kubectl, helm, builds the images and
# deploys the stack into a local kind cluster.
[gateway]
gateway-host ansible_host=127.0.0.1 ansible_connection=local

