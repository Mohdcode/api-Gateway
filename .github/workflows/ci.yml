name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: go.mod

jobs:
  devops-validate:
    name: deployment config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install yamllint
        run: python -m pip install yamllint

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: validate deployment configuration
        run: make validate-devops

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: test (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: build packages
        run: go build ./...

      - name: build gateway binary
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/Mohdcode/api-Gateway/internal/gateway.version=${GITHUB_SHA::7} -X github.com/Mohdcode/api-Gateway/internal/gateway.commit=${GITHUB_SHA}" \
            -o bin/gateway ./cmd/gateway

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: gateway-linux-amd64
          path: bin/gateway
          retention-days: 7

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: api-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build backend images
        run: |
          for n in 1 2 3; do
            docker build -f Dockerfile.backend --build-arg BACKEND=backend${n} -t api-gateway-backend-${n}:ci .
          done
