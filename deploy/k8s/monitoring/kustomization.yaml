apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - servicemonitor.yaml
  - prometheusrule.yaml

configMapGenerator:
  - name: api-gateway-grafana-dashboard
    namespace: monitoring
    files:
      - grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: API Gateway
