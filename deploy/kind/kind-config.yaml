kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: api-gateway
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080 # HTTP_INGRESS_HOST_PORT
        protocol: TCP
      - containerPort: 443
        hostPort: 18443 # HTTPS_INGRESS_HOST_PORT
        protocol: TCP
  - role: worker
  - role: worker
networking:
  apiServerAddress: "127.0.0.1"
